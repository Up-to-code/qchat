<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QChat developer docs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" title="docsify-darklight-theme" type="text/css" />
</head>
<body>
  <div id="app">Loading QChat docs…</div>
  <script>
    window.$docsify = {
      name: "QChat",
      repo: "https://github.com/Up-to-code/qchat",
      loadSidebar: "_sidebar.md",
      subMaxLevel: 2,
      auto2top: true,
      relativePath: true,
      darklightTheme: {
        defaultTheme: "dark",
        codeFontFamily: "ui-monospace,SFMono-Regular,Menlo,monospace",
        bodyFontSize: "15px",
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
</body>
</html>
